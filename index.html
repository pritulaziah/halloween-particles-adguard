<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252028" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>ADGUARD Particles</title>
  </head>
  <body>
    <div id="app">
      <div
        class="preloader"
        id="preloader"
        role="progressbar"
        aria-label="Loading resources"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="preloader__glow" aria-hidden="true"></div>
        <div class="preloader__content">
          <p class="preloader__value">
            <span class="preloader__percent" id="preloader-percent">0</span>
            <span class="preloader__unit">%</span>
          </p>
          <div class="preloader__track">
            <div class="preloader__bar" id="preloader-bar"></div>
          </div>
        </div>
      </div>
      <canvas id="scene"></canvas>
      <button
        class="music-toggle"
        id="music-toggle"
        type="button"
        aria-label="Play music"
        aria-pressed="false"
        title="Play music"
      >
        <img
          class="music-toggle__icon music-toggle__icon--off"
          src="/icons/music-off.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="music-toggle__icon music-toggle__icon--on"
          src="/icons/music-on.svg"
          alt=""
          aria-hidden="true"
        />
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
